apiVersion: apps/v1
kind: Deployment

metadata:
  name: churn-api-deployment

spec:
  replicas: 7

  selector:
    matchLabels:
      app: churn-api

  template:

    metadata:
      labels:
        app: churn-api

    spec:
      containers:
      - name: churn-api

        image: 110044/churn-api:v1

        ports:
        - containerPort: 8000
